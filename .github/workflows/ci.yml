name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy ingestion/

  test:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  dbt_build:
    name: dbt build (CI schema)
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'pull_request'
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      DBT_PROFILES_DIR: ./dbt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt
        run: pip install -e ".[dbt]"
      - name: Fetch prod manifest for slim CI
        # Replace with your real manifest source (S3, artifact store, etc.)
        run: |
          mkdir -p prod-artifacts
          # aws s3 cp s3://pix-observatory-artifacts/manifest.json prod-artifacts/ || true
      - name: dbt deps
        working-directory: dbt
        run: dbt deps
      - name: dbt build (slim CI)
        working-directory: dbt
        run: |
          dbt build --target ci \
            --select state:modified+ \
            --defer --state ../prod-artifacts || \
          dbt build --target ci
