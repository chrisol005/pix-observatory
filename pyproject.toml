[project]
name = "pix_observatory"
version = "0.1.0"
description = "End-to-end data platform on the Brazilian PIX ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Christian Oliveira" }]
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyarrow>=16",
    "pandas>=2.2",
    "numpy>=1.26",
    "faker>=25",
    "boto3>=1.34",
    "structlog>=24.1",
    "typer>=0.12",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]
dbt = [
    "dbt-core>=1.8",
    "dbt-snowflake>=1.8",
]
ml = [
    "prophet>=1.1",
    "mlflow>=2.13",
    "scikit-learn>=1.5",
]
quality = [
    "great-expectations>=0.18",
]
spark = [
    "pyspark>=3.5",
]

[project.scripts]
pixo = "pix_observatory.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion/pix_observatory"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Typer exige chamar Option/Argument no default do parâmetro; é o padrão correto.
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
# Os decorators do Typer (@app.command) não são tipados; sem isso o strict reclama.
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=ingestion --cov-report=term-missing"
