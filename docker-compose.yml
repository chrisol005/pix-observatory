version: "3.9"

# Local development stack for PIX Observatory.
# Airflow is run via Astro CLI in its own directory; this file covers
# the auxiliary services: Metabase for BI exploration and MLflow for
# experiment tracking.

services:
  metabase:
    image: metabase/metabase:v0.49.6
    container_name: pixo-metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_TYPE: h2
    volumes:
      - metabase_data:/metabase-data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: pixo-mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow

volumes:
  metabase_data:
  mlflow_data:
